<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gianluca Papeo | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=KoHo:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand ">
      <div class="container">
        <a class="navbar-logo" href="index.html">
          <img src="images/logo.png" alt="Gianluca Papeo Logo" class="logo-img">
        </a>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container col-md-12">

    <!-- contact form -->
    <h2 class="row-4 ">Contact</h2>
    <form class="row 3">
      <div class="col-md-6">
        <label for="fname" class="form-label">First Name</label>
        <input type="text" id="fname" name="fname" class="form-control" >
      </div>
      <div class="col-md-6">
        <label for="lname" class="form-label">Last Name</label>
        <input type="text" id="lname" name="lname" class="form-control">
      </div>
      <div class="col-12">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control">
      </div>
      <div class="col-12">
        <label for="message" class="form-label">Message Me!</label>
        <textarea id="message" name="message" rows="4" class="form-control" ></textarea>
      </div>
      <div class="col-12 m-4">
        <button type="submit" class="btn">Submit</button>
      </div>
    </form>

    <!-- resume section -->
    <section class="col-6 m-4">
      <h2 class="col-6 m-4">Resume</h2>
      <p>You can view or download my resume below:</p>
      <a href="files/Gianluca-Papeo-Resume.pdf">Download Resume (PDF)</a>
      <div>
        <img src="images/resume.png" alt="Resume Preview" class="img-fluid border">
      </div>
    </section>

  </main>

 
 <!-- footer -->
 <footer class="footer text-center p-4">
  <div class="social-icons">
    <a href="https://instagram.com" target="_blank"><img src="images/instagram.png" alt="Instagram" class="icon"></a>
    <a href="https://linkedin.com" target="_blank"><img src="images/linkedin.png" alt="LinkedIn" class="icon"></a>
    <a href="https://facebook.com" target="_blank"><img src="images/facebook.png" alt="Facebook" class="icon"></a>
  </div>
  <p class="copyright">Copyright Gianluca Papeo 2025</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
